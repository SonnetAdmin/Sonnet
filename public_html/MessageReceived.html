<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link href="css/sonnet.css" rel="stylesheet">
        <title>Message Received</title>
    </head>
    <body>
        <div class="book-page">
            <header>
                <h1>Message Received</h1>
                <h4>Thank you for your interest. We will be in touch presently.</h4>
                <h5>-SonnetSoft</h5>
            </header>
        </div>
        <main class="content">
            <br>
            <a class="button" href="Home.html" id="back" role="button">Home</a>
        </main>
    </body>
    <script>
        document.addEventListener('keydown', function (e) {
            // Block F12
            if (event.key === 'F12') {
                e.preventDefault();
                return false;
            }

            // Block Ctrl+Shift+I (Inspect), Ctrl+Shift+J (Console), Ctrl+Shift+C (Element Selector)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
                e.preventDefault();
                return false;
            }

            // Block Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'U') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });
    </script>
</html>
