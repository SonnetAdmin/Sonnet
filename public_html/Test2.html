<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link href="css/sonnet.css" rel="stylesheet">
        <title>Test</title>
    </head>
    <body>
        <header>
            <h1>Open Window Test</h1>
        </header>

        <form>
            <button class="button" id="about" onclick="openwin('About.html')" role="button">About</button>
            <button class="button" id="code_examples" onclick="openwin('CodeExamples.html')" role="button">Code Examples</button>
            <button class="button" id="benefits" onclick="openwin('Benefits.html')" role="button">Benefits</button>
            <button class="button" id="installation" onclick="openwin('Installation.html')" role="button">Installation</button>
            <button class="button" id="contact_us_modal" onclick="openwin('ContactUs.html')" role="button">Contact Us</button>
        </form>

    </body>


    <script>
        function openwin(url) {
            window.open(url, "popup", "titlebar=0,menubar=0,status=0,scrollbars=0,resizable=0,width=800,height=800,location=1,left=902");
        }


        // User limiting
        document.addEventListener('keydown', function (e) {
            // Block F12
            if (event.key === 'F12') {
                e.preventDefault();
                return false;
            }

            // Block Ctrl+Shift+I (Inspect), Ctrl+Shift+J (Console), Ctrl+Shift+C (Element Selector)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
                e.preventDefault();
                return false;
            }

            // Block Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'U') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });
    </script>
</html>
