<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link href="css/sonnet.css" rel="stylesheet">
        <title>Sonnet - Login</title>
    </head>
    <body>
        <div class="book-page">
            <header>
                <h1>Sonnet - Login</h1>
            </header>

            <main class="content">
                <form action="Home.html" method="post">
                    <p class="left-column">
                        <label for="username">Username:</label>
                        <input id="username" placeholder="Enter Username" required type="text">
                    </p>
                    <p class="right-column">
                        <label for="password">Password:</label>
                        <input id="password" placeholder="Enter Password" required type="password">
                    </p>
                    <button class="button" id="login" onclick="check_details()" role="button" type="submit">Login</button>

                    <button class="button" hidden id="reset" onclick="reset_form()" role="button" type="reset">Reset Form</button>

                    <div class="error" id="error_message"></div>
                </form>
            </main>
        </div>

    </body>
    <script>
        document.addEventListener('keydown', function (e) {
            // Block F12
            if (event.key === 'F12') {
                e.preventDefault();
                return false;
            }

            // Block Ctrl+Shift+I (Inspect), Ctrl+Shift+J (Console), Ctrl+Shift+C (Element Selector)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
                e.preventDefault();
                return false;
            }

            // Block Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'U') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        function check_details() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if (!(username === "admin" && password === "pass")) {
                event.preventDefault();
                document.getElementById("error_message").textContent = "Invalid username or password. Please try again.";
                document.getElementById("reset").hidden = false;
            }
        }

        function reset_form() {
            document.getElementById("reset").hidden = true;
        }

    </script>
</html>
