<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link href="css/sonnet.css" rel="stylesheet">
        <title>Sonnet</title>
    </head>
    <body>
        <p>Sonnet</p>
        <img src="src/test_staff_cover.jpg"> <br> <br>
        <form action="Home.html" method="post">
            <label for="username">Username:</label> <br>
            <input id="username" placeholder="Enter Username" type="text" required> <br>
            <label for="password">Password:</label> <br>
            <input id="password" placeholder="Enter Password" type="password" required> <br>
            <button type="submit" id="login" role="button" class="button" onclick="check_details()">Login</button> <br>
            <button type="reset" id="reset" role="button" class="button" hidden>Reset Form</button> <br>
            <div id="error_message" style="color: red;"></div>
        </form>

    </body>
    <script>

        function check_details() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

             if (username !== "admin" && password !== "pass")
             {
                 event.preventDefault();
                 document.getElementById("error_message").textContent = "Invalid username or password. Please try again.";
                 document.getElementById("reset").hidden = false;

             }
        }
    </script>
</html>
