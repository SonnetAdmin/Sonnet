<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link rel="icon" type="image/x-icon" href="src/SonnetIcon.ico">
        <link href="css/sonnet.css" rel="stylesheet">
        <script src="js/jquery-4.0.0.min.js"></script>
        <script src="js/jquery.js"></script>
        <script src="js/modal.js"></script>
        <title>Sonnet - Gallery</title>
    </head>
    <body>
        <dialog class="book-modal" id="pageModal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="close-modal-btn" onclick="closePopup()" type="button">Close ✕</button>
            </div>
            <iframe class="modal-frame" id="modalFrame" title="Embedded Page"></iframe>
        </dialog>
        <header>
            <h3>Sonnet - Gallery</h3>
            <form class="flow">
                <label class="vintage-caption">2015 European Software Testing Awards <a id="awards" class="img" onmouseover="openPopup('src/2015Awards.png','2015 European Software Testing Awards')" href="src/2015Awards.png" rel="noopener noreferrer" target="_blank"><img class="vintage-frame" src="src/2015Awards.png"></a></label>
                <label class="vintage-caption">2015 European Software Testing Award <a id="award" class="img" onmouseover="openPopup('src/2015Award.png','2015 European Software Testing Award')" rel="noopener noreferrer" target="_blank"><img class="vintage-frame" src="src/2015Award.png"></a></label>
                <label class="vintage-caption">2015 European Software Testing Ranorex Award Trophy Banner <a id="banner" class="img" onmouseover="openPopup('src/RanorexBestTest.png','2015 European Software Testing Ranorex Award Trophy Banner')" rel="noopener noreferrer" target="_blank"><img class="vintage-frame" src="src/RanorexBestTest.png"></a></label>
                <label class="vintage-caption">2015 European Software Testing Ranorex Award Trophy <a id="trophy" class="img" onmouseover="openPopup('src/Trophy.png','2015 European Software Testing Ranorex Award Trophy')" rel="noopener noreferrer" target="_blank"><img class="vintage-frame" src="src/Trophy.png"></a></label>
                <label class="vintage-caption">2015 European Software Testing Certificate <a id="certificate" class="img" onmouseover="openPopup('src/Certificate.png','2015 European Software Testing Certificate')" rel="noopener noreferrer" target="_blank"><img class="vintage-frame" src="src/Certificate.png"></a></label>
                <a class="button" href="Home.html">Back</a>
            </form>
        </header>
    </body>

    <script>
        const modal = document.getElementById("pageModal");
        const modalFrame = document.getElementById("modalFrame");
        const modalTitle = document.getElementById("modalTitle");

        function openPopup(src, titleText) {
            modalFrame.src = src;
            modalTitle.textContent = titleText || "Sonnet";
            modal.showModal();
        }

        function closePopup() {
            modal.close();
        }
    </script>
</html>
