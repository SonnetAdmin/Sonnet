<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link href="css/sonnet.css" rel="stylesheet">
        <title>Sonnet - Contact Us</title>
    </head>
    <body>
        <div class="book-page">
            <header>
                <h1>Sonnet - Contact Us</h1>
                <h4>Please feel free to reach out to us with any questions or feedback.</h4>
            </header>
            <main class="content">
                <form action="MessageReceived.html" method="post">
                    <p class="left-column">
                        <label for="name">Full Name:</label>
                        <input id="name" name="name" required type="text" onkeypress="dynamic_check()" placeholder="Enter your full name">
                        <label class="error" for="name" id="error_message_name"></label>
                    </p>

                    <p class="right-column">
                        <label for="email">Email:</label>
                        <input id="email" name="email" required type="email" placeholder="Enter your email">
                    </p>

                    <p class="bottom-row">
                        <label for="contact_option">Contact By Phone:<input type="checkbox" id="contact_option" onclick="contact_by_phone()"> </label>
                        <input id="phone" name="phone" required type="tel" maxlength="11" placeholder="Enter your number" hidden>
                    </p>

                    <p class="bottom-row">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" required rows="4" onkeypress="dynamic_check()" placeholder="Enter your message"></textarea>
                        <label class="error" for="message" id="error_message_message"></label>
                    </p>
                    <button class="button" id="submit" onclick="check_contact_form()" role="button" type="submit">Submit</button>

                    <button class="button" hidden id="reset" onclick="reset_form()" role="button" type="reset">Reset Form</button>
                    <label class="error" id="error_message"></label>
                </form>
            </main>
        </div>

    </body>
    <script>
        function check_contact_form() {
            var username = document.getElementById("name").value;
            var message = document.getElementById("message").value;

            var valid = true;
            document.getElementById("error_message_name").textContent = "";
            document.getElementById("error_message_message").textContent = "";
            document.getElementById("error_message").textContent = "";

            if (username.length < 3) {
                event.preventDefault();
                valid = false;
                document.getElementById("error_message_name").textContent = "Name too short. Please try again.";
                document.getElementById("reset").hidden = false;

            }
            if (message.length < 15) {
                event.preventDefault();
                valid = false;
                document.getElementById("error_message_message").textContent = "Message needs to be more than 15 characters. Please add more.";
                document.getElementById("reset").hidden = false;
            }
            if (!valid) {
                event.preventDefault();
                document.getElementById("error_message").textContent = "Please correct the errors above before submitting.";
            }
        }

        function reset_form() {
            document.getElementById("error_message_name").textContent = "";
            document.getElementById("error_message_message").textContent = "";
            document.getElementById("error_message").textContent = "";
            document.getElementById("reset").hidden = true;
        }

        function dynamic_check() {
            if (document.getElementById("name").value.length >= 2 && document.getElementById("message").value.length >= 15) {
                document.getElementById("error_message").textContent = "";
            }
            if (document.getElementById("name").value.length >= 2) {
                document.getElementById("error_message_name").textContent = "";
            }
            if (document.getElementById("message").value.length >= 15) {
                document.getElementById("error_message_message").textContent = "";
            }

        }

        function contact_by_phone(){
            if (document.getElementById("phone").hidden === true){
                document.getElementById("phone").hidden = false;
            }
            else{
                document.getElementById("phone").hidden = true;
            }

        }




        // User Limiting //
        document.addEventListener('keydown', function (e) {
            // Block F12
            if (event.key === 'F12') {
                e.preventDefault();
                return false;
            }

            // Block Ctrl+Shift+I (Inspect), Ctrl+Shift+J (Console), Ctrl+Shift+C (Element Selector)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
                e.preventDefault();
                return false;
            }

            // Block Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'U') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });
    </script>
</html>
