<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css" rel="stylesheet">
    <title>Template</title>
</head>
<body>
<h1>Template</h1>

<label>I am a label</label> <br>

<button id="button">I am a button</button> <br>

<div id="inputs">
    <input id="text" type="text" placeholder="I am a text input"> <br>
    <input id="radio" type="radio" placeholder="I am a radio input"> <br>
    <input id="checkbox" type="checkbox" placeholder="I am a checkbox input"> <br>
    <input id="date" type="date" placeholder="I am a date input"> <br>
    <input id="password" type="password" placeholder="I am a password input"> <br>
</div>

<textarea id="textarea" placeholder="I am a textarea"></textarea> <br>

<select id="select">
    <option value="option1">Option 1</option>
    <option value="option2">Option 2</option>
</select> <br>

<datalist id="datalist">
    <option value="Option 1">
    <option value="Option 2">
</datalist> <br>

<a href="https://example.com">I am a link</a> <br>

<table>
    <tr>
        <th>Header 1</th>
        <th>Header 2</th>
    </tr>
    <tr>
        <td>Row 1, Cell 1</td>
        <td>Row 1, Cell 2</td>
    </tr>
</table> <br>

<form action=""></form> <br>

</body>
</html>
